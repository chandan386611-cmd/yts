name: Daily Automated YouTube Short

on:
  schedule:
    # 0 12 * * * is 12:00 UTC (5:30 PM IST), optimal upload window for YouTube Shorts
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (render video without publishing to YouTube)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      custom_topic:
        description: 'Optional custom topic to override automated selection'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate-and-publish:
    name: Generate & Publish Short
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core
          ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure Default Audio Assets
        run: |
          python scripts/generate_default_assets.py

      - name: Run Shorts Generation & Publishing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || 'pNInz6obpgDQGcFmaJgB' }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_flash_v2_5' }}
          USE_EDGE_TTS_FALLBACK: ${{ vars.USE_EDGE_TTS_FALLBACK || 'true' }}
          EDGE_TTS_VOICE: ${{ vars.EDGE_TTS_VOICE || 'hi-IN-MadhurNeural' }}
          VOICE_RATE: ${{ vars.VOICE_RATE || '+14%' }}
          LANGUAGE: ${{ vars.LANGUAGE || 'hinglish' }}
          ENABLE_FAL_HOOK: ${{ vars.ENABLE_FAL_HOOK || 'true' }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          FAL_DAILY_BUDGET_USD: ${{ vars.FAL_DAILY_BUDGET_USD || '1.00' }}
          FAL_MONTHLY_BUDGET_USD: ${{ vars.FAL_MONTHLY_BUDGET_USD || '25.00' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_FLUX_MODEL: ${{ vars.CLOUDFLARE_FLUX_MODEL || '@cf/black-forest-labs/flux-1-schnell' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          CONTAINS_SYNTHETIC_MEDIA: ${{ vars.CONTAINS_SYNTHETIC_MEDIA || 'true' }}
          NICHE_TOPIC: ${{ vars.NICHE_TOPIC || 'Dark Psychology & Human Behavior Facts' }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.custom_topic }}" ]; then
            ARGS="$ARGS --topic \"${{ github.event.inputs.custom_topic }}\""
          fi
          python -m src.main $ARGS

      - name: Commit & Push Updated History and Spend Tracker
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/spend_tracker.json
          if git diff --staged --quiet; then
            echo "No changes in history or spend tracker to commit."
          else
            git commit -m "chore(pipeline): record published YouTube short [skip ci]"
            git push origin main
          fi
